<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gübre & İlaçlama Masrafları</title>
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.replace('giris.html');
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; padding: 1rem; display: flex; flex-direction: column; align-items: center; margin:0; }
        .container { width: 100%; max-width: 600px; background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-title { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #38a169; padding-bottom: 10px; margin-bottom: 15px; }
        h2 { color: #38a169; margin: 0; font-size: 1.3rem; }
        .user-tag { color: #718096; font-size: 0.85rem; font-weight: normal; }
        
        .readonly-banner { background: #feebc8; color: #7b341e; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; display: none; }
        
        .form-section { background: #f7fafc; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #38a169; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #4a5568;}
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn-save { background: #38a169; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 5px;}
        .btn-cancel { background: #a0aec0; color: white; border: none; padding: 8px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; margin-top: 8px; display: none;}
        .btn-back { background: #edf2f7; color: #4a5568; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px; text-decoration: none; display: inline-block;}
        
        .history-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .history-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px dashed #cbd5e0; padding-bottom: 5px; margin-bottom: 8px; font-size: 0.9rem;}
        .history-body { font-size: 0.85rem; color: #4a5568; display: grid; grid-template-columns: 1fr 1fr; gap: 5px;}
        .total-badge { background: #c6f6d5; color: #22543d; padding: 4px 8px; border-radius: 4px; font-weight: bold; display: inline-block; margin-top: 5px; font-size: 0.85rem;}
        
        .actions-box { grid-column: span 2; display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; border-top: 1px solid #edf2f7; padding-top: 6px; }
        .btn-edit { background: #3182ce; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .btn-del { background: #e53e3e; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="btn-back">⬅️ Ana Menüye Dön</a>
        
        <div class="header-title">
            <h2>🌱 Gübre & İlaçlama Masrafları</h2>
            <span class="user-tag" id="userDisplay">Kullanıcı: Yükleniyor...</span>
        </div>

        <div id="readOnlyBanner" class="readonly-banner">
            👁️ Salt Okunur Mod: Bu sayfadaki verileri görüntüleyebilirsiniz ancak yeni kayıt ekleyemez veya değiştiremezsiniz.
        </div>

        <input type="hidden" id="editKey" value="">

        <div class="form-section">
            <div class="form-group">
                <label>Görüntülenecek / İşlem Yapılacak Sezon:</label>
                <select id="sezonSecici" onchange="verileriYukle()"></select>
            </div>
        </div>

        <div id="formContainer">
            <div class="form-section">
                <div class="form-group">
                    <label>Tarih:</label>
                    <input type="date" id="tarih">
                </div>
                <div class="form-group">
                    <label>Gübre / İlaç Adı:</label>
                    <input type="text" id="malzemeAdi" placeholder="Örn: 26 Can Gübre veya Ot İlacı">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Miktar (Çuval/Litre/Adet):</label>
                        <input type="number" id="gubreMiktar" placeholder="Örn: 10" oninput="gubreMasrafHesapla()">
                    </div>
                    <div class="form-group">
                        <label>Birim Fiyatı (TL):</label>
                        <input type="number" id="gubreBirimFiyat" placeholder="Örn: 450" oninput="gubreMasrafHesapla()">
                    </div>
                </div>
                <div class="form-group">
                    <label>Hesaplanan Malzeme Tutar (TL):</label>
                    <input type="number" id="gubreTutar" placeholder="0.00" readonly style="background:#edf2f7; font-weight:bold;">
                </div>
                <div class="form-group">
                    <label>Gübre Atım İşçilik / Yevmiye Ücreti (TL):</label>
                    <input type="number" id="iscilikUcreti" placeholder="0.00" oninput="toplamHesapla()">
                </div>
            </div>

            <div class="form-section">
                <div class="form-group">
                    <label>Kullanılan Araç:</label>
                    <select id="aracPlaka"></select>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Yapılan KM:</label>
                        <input type="number" id="yapilanKm" placeholder="KM" oninput="yolMasrafiHesapla()">
                    </div>
                    <div class="form-group">
                        <label>Ort. Tüketim (L/100km):</label>
                        <input type="number" id="ortTuketim" placeholder="Örn: 6.5" step="0.1" oninput="yolMasrafiHesapla()">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Hesaplanan Litre:</label>
                        <input type="number" id="yolLitre" placeholder="Litre" readonly style="background:#edf2f7;">
                    </div>
                    <div class="form-group">
                        <label>Yakıt Litre Fiyatı (TL):</label>
                        <input type="number" id="yolLitreFiyat" placeholder="Örn: 42.50" step="0.1" oninput="yolMasrafiHesapla()">
                    </div>
                </div>
                <div class="form-group">
                    <label>Hesaplanan Yol Masrafı (TL):</label>
                    <input type="number" id="yolMasrafi" placeholder="0.00" readonly style="background:#e2e8f0; font-weight:bold;">
                </div>
                <div class="form-group">
                    <label>Yol Güzergahı / Açıklama:</label>
                    <input type="text" id="yolAciklama" placeholder="Örn: Bayi - Bahçe git-gel">
                </div>
            </div>

            <div class="form-section">
                <div class="form-group">
                    <label>Ödemeyi Yapan Kişi:</label>
                    <select id="odeyenKisi"></select>
                </div>
                <div style="text-align: right; margin-bottom: 10px;">
                    <span class="total-badge" id="genelToplamGösterge">Toplam Masraf: 0 TL</span>
                </div>
                <button class="btn-save" id="btnKaydet" onclick="gubreKaydet()">Verileri Kaydet</button>
                <button class="btn-cancel" id="btnIptal" onclick="formuSifirla()">İptal Et</button>
            </div>
        </div>

        <h3 style="color:#2d3748; margin-top: 20px; font-size:1.1rem; border-bottom:2px solid #edf2f7; padding-bottom:5px;">📋 Geçmiş Gübre & İlaç Kayıtları</h3>
        <div id="gecmisListesi">Yükleniyor...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyApN7vhnM30cQ1RdAsXiUS8AY08G2QklYY",
            authDomain: "findikhasattakip.firebaseapp.com",
            databaseURL: "https://findikhasattakip-default-rtdb.firebaseio.com",
            projectId: "findikhasattakip",
            storageBucket: "findikhasattakip.firebasestorage.app",
            messagingSenderId: "296913243470",
            appId: "1:296913243470:web:f2a6cfed4196ff44e0221f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const currentUser = localStorage.getItem('currentUser') || 'Anonim';
        document.getElementById('userDisplay').innerText = `Kullanıcı: ${currentUser}`;

        if (currentUser !== 'Anonim') {
            const connectedRef = db.ref('.info/connected');
            const userPresenceRef = db.ref('onlineUsersDB/' + currentUser);

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    userPresenceRef.onDisconnect().set({
                        status: 'offline',
                        lastSeen: new Date().toLocaleString('tr-TR')
                    });

                    userPresenceRef.set({
                        status: 'online',
                        lastSeen: new Date().toLocaleString('tr-TR'),
                        device: /Android|iPhone|iPad/i.test(navigator.userAgent) ? '📱 Mobil' : '💻 Bilgisayar'
                    });
                }
            });
        }

        function logEkle(islemAdi, detay = '') {
            db.ref('logsDB').push({
                kullanici: currentUser,
                islem: islemAdi,
                detay: detay,
                tarih: new Date().toLocaleString('tr-TR'),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        logEkle("Sayfa Ziyareti", "Gübre & İlaçlama Sayfası");

        document.getElementById('tarih').valueAsDate = new Date();

        let userPermission = "tam";
        let varsayilanlar = {};
        let tumKayıtlar = {};

        if (currentUser) {
            db.ref('usersDB/' + currentUser).on('value', (snapshot) => {
                const userData = snapshot.val();
                if (userData && userData.permissions) {
                    userPermission = userData.permissions.gubre || "tam";
                    yetkiUygula();
                }
            });
        }

        function yetkiUygula() {
            if (userPermission === "oku") {
                document.getElementById('formContainer').style.display = "none";
                document.getElementById('readOnlyBanner').style.display = "block";
            } else {
                document.getElementById('formContainer').style.display = "block";
                document.getElementById('readOnlyBanner').style.display = "none";
            }
            verileriYukle();
        }

        db.ref('varsayilanlarDB').on('value', (snapshot) => {
            varsayilanlar = snapshot.val() || {};
        });

        db.ref('sezonlarDB').on('value', (snapshot) => {
            const list = snapshot.val() || ["2026"];
            const select = document.getElementById('sezonSecici');
            select.innerHTML = "";
            const arr = Array.isArray(list) ? list : Object.values(list);
            arr.forEach(s => select.innerHTML += `<option value="${s}">${s} Sezonu</option>`);
            if (varsayilanlar.sezon) select.value = varsayilanlar.sezon;
            verileriYukle();
        });

        db.ref('araclarDB').on('value', (snapshot) => {
            const list = snapshot.val() || [];
            const select = document.getElementById('aracPlaka');
            select.innerHTML = '<option value="">Araç Seçin...</option>';
            const arr = Array.isArray(list) ? list : Object.values(list);
            arr.forEach(a => select.innerHTML += `<option value="${a}">${a}</option>`);
            if (varsayilanlar.arac) select.value = varsayilanlar.arac;
        });

        db.ref('kisilerDB').on('value', (snapshot) => {
            const list = snapshot.val() || [];
            const select = document.getElementById('odeyenKisi');
            select.innerHTML = '<option value="">Kişi Seçin...</option>';
            const arr = Array.isArray(list) ? list : Object.values(list);
            arr.forEach(k => select.innerHTML += `<option value="${k}">${k}</option>`);
            if (varsayilanlar.kisi) select.value = varsayilanlar.kisi;
        });

        function gubreMasrafHesapla() {
            const miktar = parseFloat(document.getElementById('gubreMiktar').value) || 0;
            const birimFiyat = parseFloat(document.getElementById('gubreBirimFiyat').value) || 0;
            if (miktar > 0 && birimFiyat > 0) {
                document.getElementById('gubreTutar').value = (miktar * birimFiyat).toFixed(2);
            } else {
                document.getElementById('gubreTutar').value = "";
            }
            toplamHesapla();
        }

        function yolMasrafiHesapla() {
            const km = parseFloat(document.getElementById('yapilanKm').value) || 0;
            const tuketim = parseFloat(document.getElementById('ortTuketim').value) || 0;
            const litreFiyat = parseFloat(document.getElementById('yolLitreFiyat').value) || 0;

            if (km > 0 && tuketim > 0) {
                const hesaplananLitre = (km * tuketim) / 100;
                document.getElementById('yolLitre').value = hesaplananLitre.toFixed(2);

                if (litreFiyat > 0) {
                    const toplamYolMasrafi = hesaplananLitre * litreFiyat;
                    document.getElementById('yolMasrafi').value = toplamYolMasrafi.toFixed(2);
                } else {
                    document.getElementById('yolMasrafi').value = "";
                }
            } else {
                document.getElementById('yolLitre').value = "";
                document.getElementById('yolMasrafi').value = "";
            }
            toplamHesapla();
        }

        function toplamHesapla() {
            const gubreTutar = parseFloat(document.getElementById('gubreTutar').value) || 0;
            const iscilikUcreti = parseFloat(document.getElementById('iscilikUcreti').value) || 0;
            const yolMasrafi = parseFloat(document.getElementById('yolMasrafi').value) || 0;
            const genel = gubreTutar + iscilikUcreti + yolMasrafi;
            document.getElementById('genelToplamGösterge').innerText = `Toplam Masraf: ${genel.toFixed(2)} TL`;
        }

        function gubreKaydet() {
            if (userPermission === "oku") return alert("Salt okunur moddasınız!");

            const tarih = document.getElementById('tarih').value;
            const gubreTutar = parseFloat(document.getElementById('gubreTutar').value) || 0;
            const iscilikUcreti = parseFloat(document.getElementById('iscilikUcreti').value) || 0;
            const yolMasrafi = parseFloat(document.getElementById('yolMasrafi').value) || 0;
            const malzemeAdi = document.getElementById('malzemeAdi').value.trim();
            const editKey = document.getElementById('editKey').value;

            if (!tarih) return alert("Lütfen tarihi seçiniz!");
            if (gubreTutar <= 0 && iscilikUcreti <= 0 && yolMasrafi <= 0) return alert("En az bir masraf kalemini giriniz!");

            const kayitData = {
                tarih: tarih,
                sezon: document.getElementById('sezonSecici').value,
                malzemeAdi: malzemeAdi,
                gubreMiktar: parseFloat(document.getElementById('gubreMiktar').value) || 0,
                gubreBirimFiyat: parseFloat(document.getElementById('gubreBirimFiyat').value) || 0,
                gubreTutar: gubreTutar,
                iscilikUcreti: iscilikUcreti,
                aracPlaka: document.getElementById('aracPlaka').value,
                yapilanKm: parseFloat(document.getElementById('yapilanKm').value) || 0,
                ortTuketim: parseFloat(document.getElementById('ortTuketim').value) || 0,
                yolLitre: parseFloat(document.getElementById('yolLitre').value) || 0,
                yolLitreFiyat: parseFloat(document.getElementById('yolLitreFiyat').value) || 0,
                yolMasrafi: yolMasrafi,
                yolAciklama: document.getElementById('yolAciklama').value.trim(),
                toplamMasraf: gubreTutar + iscilikUcreti + yolMasrafi,
                odeyen: document.getElementById('odeyenKisi').value,
                ekleyen: currentUser
            };

            if (editKey) {
                db.ref('gubreMasraflariDB/' + editKey).set(kayitData, (error) => {
                    if (!error) {
                        alert("Kayıt başarıyla güncellendi.");
                        logEkle("Gübre/İlaç Kaydı Güncellendi", `${kayitData.toplamMasraf.toFixed(2)} TL - ${malzemeAdi}`);
                        formuSifirla();
                    }
                });
            } else {
                db.ref('gubreMasraflariDB').push(kayitData, (error) => {
                    if (!error) {
                        alert("Kayıt başarıyla eklendi.");
                        logEkle("Gübre/İlaç Kaydı Eklendi", `${kayitData.toplamMasraf.toFixed(2)} TL - ${malzemeAdi}`);
                        formuSifirla();
                    }
                });
            }
        }

        function verileriYukle() {
            const secilenSezon = document.getElementById('sezonSecici').value;
            const container = document.getElementById('gecmisListesi');

            db.ref('gubreMasraflariDB').orderByChild('sezon').equalTo(secilenSezon).on('value', (snapshot) => {
                tumKayıtlar = snapshot.val() || {};
                container.innerHTML = "";

                if (Object.keys(tumKayıtlar).length === 0) {
                    container.innerHTML = "<p style='color:#718096; font-size:0.9rem;'>Bu sezona ait henüz gübre/ilaç kaydı bulunmuyor.</p>";
                    return;
                }

                const keys = Object.keys(tumKayıtlar).reverse();

                keys.forEach(key => {
                    const d = tumKayıtlar[key];

                    let actionsHtml = "";
                    if (userPermission !== "oku" && d.ekleyen === currentUser) {
                        actionsHtml = `
                            <div class="actions-box">
                                <button class="btn-edit" onclick="kayitDuzenle('${key}')">✏️ Düzenle</button>
                                <button class="btn-del" onclick="gubreSil('${key}')">🗑️ Sil</button>
                            </div>
                        `;
                    }

                    container.innerHTML += `
                        <div class="history-card">
                            <div class="history-header">
                                <span>📅 ${d.tarih}</span>
                                <span style="color:#38a169;">💰 ${d.toplamMasraf ? d.toplamMasraf.toFixed(2) : 0} TL</span>
                            </div>
                            <div class="history-body">
                                <div><b>Malzeme:</b> ${d.malzemeAdi || '-'} (${d.gubreTutar || 0} TL)</div>
                                <div><b>İşçilik:</b> ${d.iscilikUcreti || 0} TL</div>
                                <div><b>Yol:</b> ${d.aracPlaka || '-'} (${d.yolMasrafi || 0} TL)</div>
                                <div><b>Ödeyen:</b> ${d.odeyen || '-'}</div>
                            </div>
                            ${actionsHtml}
                        </div>
                    `;
                });
            });
        }

        function gubreSil(key) {
            if (userPermission === "oku") return alert("Salt okunur moddasınız!");

            const silinen = tumKayıtlar[key];
            if (silinen && silinen.ekleyen && silinen.ekleyen !== currentUser) {
                return alert(`Bu kaydı yalnızca oluşturan kişi (${silinen.ekleyen}) silebilir!`);
            }

            if (confirm("Bu gübre/ilaç kaydını silmek istediğinize emin misiniz?")) {
                db.ref('gubreMasraflariDB/' + key).remove(() => {
                    logEkle("Gübre/İlaç Kaydı Silindi", silinen ? `${silinen.toplamMasraf || 0} TL - ${silinen.malzemeAdi || ''}` : `ID: ${key}`);
                });
            }
        }

        function kayitDuzenle(key) {
            if (userPermission === "oku") return;

            const data = tumKayıtlar[key];
            if (!data) return;

            if (data.ekleyen && data.ekleyen !== currentUser) {
                return alert(`Bu kaydı yalnızca oluşturan kişi (${data.ekleyen}) düzenleyebilir!`);
            }

            document.getElementById('editKey').value = key;
            document.getElementById('tarih').value = data.tarih || '';
            document.getElementById('malzemeAdi').value = data.malzemeAdi || '';
            document.getElementById('gubreMiktar').value = data.gubreMiktar || '';
            document.getElementById('gubreBirimFiyat').value = data.gubreBirimFiyat || '';
            document.getElementById('gubreTutar').value = data.gubreTutar || '';
            document.getElementById('iscilikUcreti').value = data.iscilikUcreti || '';
            document.getElementById('aracPlaka').value = data.aracPlaka || '';
            document.getElementById('yapilanKm').value = data.yapilanKm || '';
            document.getElementById('ortTuketim').value = data.ortTuketim || '';
            document.getElementById('yolLitre').value = data.yolLitre || '';
            document.getElementById('yolLitreFiyat').value = data.yolLitreFiyat || '';
            document.getElementById('yolMasrafi').value = data.yolMasrafi || '';
            document.getElementById('yolAciklama').value = data.yolAciklama || '';
            document.getElementById('odeyenKisi').value = data.odeyen || '';

            document.getElementById('btnKaydet').innerText = "Değişikliği Geçmişe İşle ve Kaydet";
            document.getElementById('btnKaydet').style.background = "#dd6b20";
            document.getElementById('btnIptal').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function formuSifirla() {
            document.getElementById('editKey').value = "";
            document.getElementById('btnKaydet').innerText = "Verileri Kaydet";
            document.getElementById('btnKaydet').style.background = "#38a169";
            document.getElementById('btnIptal').style.display = "none";
            ['malzemeAdi', 'gubreMiktar', 'gubreBirimFiyat', 'gubreTutar', 'iscilikUcreti', 'yapilanKm', 'ortTuketim', 'yolLitre', 'yolLitreFiyat', 'yolMasrafi', 'yolAciklama'].forEach(id => document.getElementById(id).value = "");
            document.getElementById('tarih').valueAsDate = new Date();

            if (varsayilanlar.sezon) document.getElementById('sezonSecici').value = varsayilanlar.sezon;
            if (varsayilanlar.kisi) document.getElementById('odeyenKisi').value = varsayilanlar.kisi;
            if (varsayilanlar.arac) document.getElementById('aracPlaka').value = varsayilanlar.arac;
        }
    </script>
</body>
</html>
