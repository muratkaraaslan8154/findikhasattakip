<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - KARAASLAN Portalı</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { margin-top: 0; color: #2d3748; margin-bottom: 1.5rem; }
        
        input { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        
        .password-wrapper { position: relative; margin: 8px 0 15px 0; }
        .password-wrapper input { margin: 0; padding-right: 40px; }
        .password-wrapper .toggle-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.2rem; user-select: none; }
        
        button { width: 100%; padding: 12px; background: #3182ce; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 5px; transition: background 0.2s; }
        button:hover { background: #2b6cb0; }
        #status { font-size: 0.9rem; margin-top: 15px; font-weight: 500; min-height: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div style="font-size: 3rem; margin-bottom: 10px;">📍🔒</div>
        <h2>Güvenli Giriş</h2>
        
        <input type="text" id="username" placeholder="Kullanıcı Adı" autocomplete="off">
        
        <div class="password-wrapper">
            <input type="password" id="pin" placeholder="PIN Kodu (Örn: 1234)" autocomplete="off">
            <span class="toggle-icon" id="togglePin" onclick="sifreGosterGizle()">👁️</span>
        </div>
        
        <button onclick="login()">Giriş Yap</button>
        <div id="status"></div>
    </div>

    <script>
        // --- FIREBASE AYARLARI ---
        const firebaseConfig = {
            apiKey: "AIzaSyApN7vhnM30cQ1RdAsXiUS8AY08G2QklYY",
            authDomain: "findikhasattakip.firebaseapp.com",
            databaseURL: "https://findikhasattakip-default-rtdb.firebaseio.com",
            projectId: "findikhasattakip",
            storageBucket: "findikhasattakip.firebasestorage.app",
            messagingSenderId: "296913243470",
            appId: "1:296913243470:web:f2a6cfed4196ff44e0221f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Ev Konum Doğrulama Ayarları
        const evEnlem = 41.01005430101983;  
        const evBoylam = 29.16667666206191; 
        const izinVerilenMesafeMetre = 100; 

        function sifreGosterGizle() {
            const pinInput = document.getElementById('pin');
            const toggleIcon = document.getElementById('togglePin');
            
            if (pinInput.type === "password") {
                pinInput.type = "text";
                toggleIcon.innerText = "🙈";
            } else {
                pinInput.type = "password";
                toggleIcon.innerText = "👁️";
            }
        }

        function mesafeHesapla(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const p1 = lat1 * Math.PI/180;
            const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        function login() {
            const user = document.getElementById('username').value.toLowerCase().trim();
            const pin = document.getElementById('pin').value.trim();
            const status = document.getElementById('status');

            if (!user || !pin) {
                status.style.color = "#e53e3e";
                status.innerText = "Kullanıcı adı ve PIN boş bırakılamaz!";
                return;
            }

            status.style.color = "#3182ce";
            status.innerText = "Kontrol ediliyor...";

            // Firebase Veritabanından Kullanıcıyı Sorgula
            db.ref('usersDB/' + user).once('value').then((snapshot) => {
                const userData = snapshot.val();
                status.style.color = "#e53e3e";

                if (!userData || userData.pin !== pin) {
                    status.innerText = "Hatalı kullanıcı adı veya PIN!";
                    return;
                }

                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                if (userData.device === "mobile" && !isMobile) {
                    status.innerText = "Bu hesaba sadece cep telefonundan girilebilir.";
                    return;
                }
                if (userData.device === "pc" && isMobile) {
                    status.innerText = "Bu hesaba sadece bilgisayardan girilebilir.";
                    return;
                }

                if (userData.requireLocation) {
                    status.style.color = "#3182ce";
                    status.innerText = "Konumunuz doğrulanıyor...";
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition((position) => {
                            const mesafe = mesafeHesapla(position.coords.latitude, position.coords.longitude, evEnlem, evBoylam);
                            if (mesafe <= izinVerilenMesafeMetre) {
                                grantAccess(user); 
                            } else {
                                status.style.color = "#e53e3e";
                                status.innerText = "Evden uzaktasınız! Giriş reddedildi.";
                            }
                        }, () => {
                            status.style.color = "#e53e3e";
                            status.innerText = "GPS okunamadı. İzin vermelisiniz!";
                        });
                        return;
                    } else {
                        status.style.color = "#e53e3e";
                        status.innerText = "Cihazınız konumu desteklemiyor.";
                        return;
                    }
                }

                grantAccess(user);
            }).catch((error) => {
                status.style.color = "#e53e3e";
                status.innerText = "Bağlantı hatası: " + error.message;
            });
        }
function grantAccess(username) {
    db.ref('logsDB').push({
        kullanici: username,
        islem: 'Sisteme Giriş Yapıldı',
        detay: 'Başarılı Oturum',
        tarih: new Date().toLocaleString('tr-TR'),
        timestamp: firebase.database.ServerValue.TIMESTAMP
    });

    const status = document.getElementById('status');
    status.style.color = "#27ae60";
    status.innerText = "Giriş Başarılı! Yönlendiriliyor...";

    localStorage.setItem('currentUser', username);
    localStorage.setItem('isLoggedIn', 'true');

    setTimeout(() => { window.location.href = 'index.html?auth=ok'; }, 1000);
}    </script>
</body>
</html>
