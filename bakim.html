<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fındık ve Ağaç Bakım Masrafları</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.replace('giris.html');
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; padding: 1.5rem 1rem; display: flex; flex-direction: column; align-items: center; margin:0; }
        .container { width: 100%; max-width: 650px; background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { border-bottom: 2px solid #e53e3e; padding-bottom: 10px; color: #2d3748; margin-top: 0; display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem;}
        .form-section { background: #fff5f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #e53e3e; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #4a5568;}
        input, select { width: 100%; padding: 9px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
        .btn { background: #e53e3e; color: white; width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; font-size: 0.95rem; margin-top: 5px;}
        .btn:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e2e8f0; font-size: 0.82rem; }
        th { background-color: #edf2f7; color: #4a5568; }
        .btn-del { background: #e53e3e; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .btn-back { display: block; text-align: center; margin-top: 20px; color: #718096; text-decoration: none; font-weight: 500;}
        .read-only-notice { display: none; background: #feebc8; color: #744210; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🪚 Ağaç & Bahçe Bakımı <span id="userTag" style="font-size:0.8rem; font-weight:normal; color:#718096;"></span></h2>
        
        <div id="readOnlyNotice" class="read-only-notice">👁️ Bu sayfada sadece görüntüleme yetkiniz bulunmaktadır.</div>

        <div class="form-section" id="bakimFormArea">
            <h3 style="margin-top:0; font-size:1rem; color:#c53030;">Yeni Bakım / Onarım Kaydı</h3>
            <div class="form-group">
                <label>Bakım Kalemi / Türü:</label>
                <select id="bakimTurSelect">
                    <option value="🪚 Motorlu Testere Benzin / Yağ / Zincir">🪚 Motorlu Testere Benzin / Yağ / Zincir</option>
                    <option value="✂️ Ağaç Budama & Filiz Alma Yevmiyesi">✂️ Ağaç Budama & Filiz Alma Yevmiyesi</option>
                    <option value="🧪 Zirai İlaç & İlaçlama İşçiliği">🧪 Zirai İlaç & İlaçlama İşçiliği</option>
                    <option value="🌾 Dal Kesme / Dip Temizliği">🌾 Dal Kesme / Dip Temizliği</option>
                    <option value="🛠️ Alet & Edavat Tamir / Alım">🛠️ Alet & Edavat Tamir / Alım</option>
                    <option value="📋 Diğer Zirai Giderler">📋 Diğer Zirai Giderler</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1;">
                    <label>Ödeyen Kişi:</label>
                    <select id="kisiSelect"></select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Sezon:</label>
                    <select id="sezonSelect"></select>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1;">
                    <label>Tutar (TL):</label>
                    <input type="number" step="0.01" id="bakimTutar" placeholder="0.00">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Tarih:</label>
                    <input type="date" id="bakimTarih">
                </div>
            </div>
            <div class="form-group">
                <label>Açıklama / Detay:</label>
                <input type="text" id="bakimAciklama" placeholder="Örn: 2 Litre motor yağı ve yeni pala zinciri alındı">
            </div>
            <button class="btn" id="btnKaydet" onclick="bakimKaydet()">Masrafı Kaydet</button>
        </div>

        <h3 style="font-size: 1rem; color: #2d3748; margin: 15px 0 5px 0;">Bakım Masraf Geçmişi</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>Tarih</th><th>Bakım Türü</th><th>Ödeyen</th><th>Tutar</th><th>Açıklama</th><th class="action-col">İşlem</th></tr>
                </thead>
                <tbody id="bakimTableBody"></tbody>
            </table>
        </div>

        <a href="index.html" class="btn-back">← Ana Menüye Dön</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyApN7vhnM30cQ1RdAsXiUS8AY08G2QklYY",
            authDomain: "findikhasattakip.firebaseapp.com",
            databaseURL: "https://findikhasattakip-default-rtdb.firebaseio.com",
            projectId: "findikhasattakip",
            storageBucket: "findikhasattakip.firebasestorage.app",
            messagingSenderId: "296913243470",
            appId: "1:296913243470:web:f2a6cfed4196ff44e0221f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const currentUser = localStorage.getItem('currentUser') || "";
        document.getElementById('userTag').innerText = "(" + currentUser + ")";
        document.getElementById('bakimTarih').valueAsDate = new Date();

        let userPermission = "tam";

        // YETKİ KONTROLÜ
        db.ref('usersDB/' + currentUser + '/permissions/bakim').on('value', (s) => {
            userPermission = s.val() || "tam";
            if (userPermission === "yok") {
                alert("Bu sayfaya erişim yetkiniz bulunmamaktadır!");
                window.location.replace('index.html');
            } else if (userPermission === "oku") {
                document.getElementById('bakimFormArea').style.display = 'none';
                document.getElementById('readOnlyNotice').style.display = 'block';
                renderBakimMasraflari();
            }
        });

        // DİNAMİK LİSTELER
        db.ref('kisilerDB').on('value', (s) => {
            const list = s.val() || [];
            document.getElementById('kisiSelect').innerHTML = list.map(item => `<option value="${item}">${item}</option>`).join('');
        });

        db.ref('sezonlarDB').on('value', (s) => {
            const list = s.val() || [];
            document.getElementById('sezonSelect').innerHTML = list.map(item => `<option value="${item}">${item}</option>`).join('');
        });

        // MASRAF LİSTELEME
        let bakimData = {};
        db.ref('bakimMasraflariDB').on('value', (s) => {
            bakimData = s.val() || {};
            renderBakimMasraflari();
        });

        function renderBakimMasraflari() {
            const tbody = document.getElementById('bakimTableBody');
            tbody.innerHTML = "";

            const actionHeader = document.querySelector('.action-col');
            if (userPermission === "oku" && actionHeader) actionHeader.style.display = 'none';

            for (const [key, item] of Object.entries(bakimData)) {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.tarih}</td>
                        <td><b>${item.tur}</b></td>
                        <td>${item.odeyen}</td>
                        <td><b>${parseFloat(item.tutar).toFixed(2)} ₺</b></td>
                        <td>${item.aciklama || '-'}</td>
                        ${userPermission !== "oku" ? `<td><button class="btn-del" onclick="bakimSil('${key}')">Sil</button></td>` : ''}
                    </tr>`;
            }
        }

        function bakimKaydet() {
            if (userPermission === "oku") return;

            const tutar = document.getElementById('bakimTutar').value;
            if (!tutar || tutar <= 0) return alert("Lütfen geçerli bir tutar girin!");

            db.ref('bakimMasraflariDB').push({
                tur: document.getElementById('bakimTurSelect').value,
                odeyen: document.getElementById('kisiSelect').value,
                sezon: document.getElementById('sezonSelect').value,
                tutar: parseFloat(tutar),
                tarih: document.getElementById('bakimTarih').value,
                aciklama: document.getElementById('bakimAciklama').value,
                ekleyen: currentUser
            });

            document.getElementById('bakimTutar').value = "";
            document.getElementById('bakimAciklama').value = "";
            alert("Bakım masrafı başarıyla kaydedildi.");
        }

        function bakimSil(key) {
            if (userPermission === "oku") return;
            if (confirm("Bu bakım kaydını silmek istediğinize emin misiniz?")) {
                db.ref('bakimMasraflariDB/' + key).remove();
            }
        }
    </script>
</body>
</html>
