<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fındık ve Ağaç Bakım Masrafları</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.replace('giris.html');
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; padding: 1.5rem 1rem; display: flex; flex-direction: column; align-items: center; margin:0; }
        .container { width: 100%; max-width: 650px; background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { border-bottom: 2px solid #e53e3e; padding-bottom: 10px; color: #2d3748; margin-top: 0; display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem;}
        
        .readonly-banner { background: #feebc8; color: #7b341e; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; display: none; }

        .form-section { background: #fff5f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #e53e3e; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #4a5568;}
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        
        .btn-add { background: #e53e3e; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-back { background: #edf2f7; color: #4a5568; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px; text-decoration: none; display: inline-block;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
        th { background-color: #edf2f7; color: #4a5568; }
        .btn-del { background: #e53e3e; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="btn-back">⬅️ Ana Menüye Dön</a>
        
        <h2>🌳 Bakım Masrafları <span style="font-size:0.85rem; color:#718096; font-weight:normal;" id="userDisplay"></span></h2>

        <div id="readOnlyBanner" class="readonly-banner">
            👁️ Salt Okunur Mod: Bu sayfadaki verileri görüntüleyebilirsiniz ancak yeni kayıt ekleyemez veya silemezsiniz.
        </div>

        <div id="formSection" class="form-section">
            <div class="form-group">
                <label>Bakım Türü:</label>
                <select id="bakimTurSelect">
                    <option value="Budama & Dal Kesim">Budama & Dal Kesim</option>
                    <option value="Dip Sürgünü / Işkın Temizliği">Dip Sürgünü / Işkın Temizliği</option>
                    <option value="Drenaj & Kanal Açma">Drenaj & Kanal Açma</option>
                    <option value="Fidan Dikimi & Bakımı">Fidan Dikimi & Bakımı</option>
                    <option value="Alet & Makine Bakımı">Alet & Makine Bakımı</option>
                    <option value="Diğer Genel Bakım">Diğer Genel Bakım</option>
                </select>
            </div>

            <div class="form-group">
                <label>İşlemi Yapan / Ödeyen Kişi:</label>
                <select id="kisiSelect"></select>
            </div>

            <div class="form-group">
                <label>Ait Olduğu Sezon:</label>
                <select id="sezonSelect"></select>
            </div>

            <div class="form-group">
                <label>Tutar (TL):</label>
                <input type="number" id="bakimTutar" placeholder="0.00">
            </div>

            <div class="form-group">
                <label>Tarih:</label>
                <input type="date" id="bakimTarih">
            </div>

            <div class="form-group">
                <label>Açıklama / Detaylar:</label>
                <textarea id="bakimAciklama" rows="2" placeholder="Örn: 2 yevmiye budamacı çalıştırıldı..."></textarea>
            </div>

            <button class="btn-add" onclick="bakimKaydet()">Bakım Kaydını Ekle</button>
        </div>

        <h3>📋 Geçmiş Bakım Kayıtları</h3>
        <table>
            <thead>
                <tr>
                    <th>Tarih</th>
                    <th>Tür</th>
                    <th>Tutar</th>
                    <th>Açıklama</th>
                    <th id="actionTh">İşlem</th>
                </tr>
            </thead>
            <tbody id="bakimTableBody">
                <tr><td colspan="5">Yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyApN7vhnM30cQ1RdAsXiUS8AY08G2QklYY",
            authDomain: "findikhasattakip.firebaseapp.com",
            databaseURL: "https://findikhasattakip-default-rtdb.firebaseio.com",
            projectId: "findikhasattakip",
            storageBucket: "findikhasattakip.firebasestorage.app",
            messagingSenderId: "296913243470",
            appId: "1:296913243470:web:f2a6cfed4196ff44e0221f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const currentUser = localStorage.getItem('currentUser') || 'Anonim';
        document.getElementById('userDisplay').innerText = `(${currentUser})`;

        // --- ONLINE DURUM & LOGLEMA ---
        if (currentUser !== 'Anonim') {
            const connectedRef = db.ref('.info/connected');
            const userPresenceRef = db.ref('onlineUsersDB/' + currentUser);

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    userPresenceRef.onDisconnect().set({
                        status: 'offline',
                        lastSeen: new Date().toLocaleString('tr-TR')
                    });

                    userPresenceRef.set({
                        status: 'online',
                        lastSeen: new Date().toLocaleString('tr-TR'),
                        device: /Android|iPhone|iPad/i.test(navigator.userAgent) ? '📱 Mobil' : '💻 Bilgisayar'
                    });
                }
            });
        }

        function logEkle(islemAdi, detay = '') {
            db.ref('logsDB').push({
                kullanici: currentUser,
                islem: islemAdi,
                detay: detay,
                tarih: new Date().toLocaleString('tr-TR'),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        logEkle("Sayfa Ziyareti", "Bakım Masrafları Sayfası");

        document.getElementById('bakimTarih').valueAsDate = new Date();

        let userPermission = "tam";
        let tumBakimlar = {};

        if (currentUser) {
            db.ref('usersDB/' + currentUser).on('value', (snapshot) => {
                const userData = snapshot.val();
                if (userData && userData.permissions) {
                    userPermission = userData.permissions.bakim || "tam";
                    yetkiUygula();
                }
            });
        }

        function yetkiUygula() {
            if (userPermission === "oku") {
                document.getElementById('formSection').style.display = "none";
                document.getElementById('readOnlyBanner').style.display = "block";
                document.getElementById('actionTh').style.display = "none";
            } else {
                document.getElementById('formSection').style.display = "block";
                document.getElementById('readOnlyBanner').style.display = "none";
                document.getElementById('actionTh').style.display = "table-cell";
            }
        }

        db.ref('varsayilanlarDB').on('value', (snapshot) => {
            const defs = snapshot.val() || {};
            
            db.ref('kisilerDB').on('value', (snap) => {
                const list = snap.val() || [];
                const select = document.getElementById('kisiSelect');
                select.innerHTML = "";
                const arr = Array.isArray(list) ? list : Object.values(list);
                arr.forEach(k => select.innerHTML += `<option value="${k}">${k}</option>`);
                if (defs.kisi) select.value = defs.kisi;
            });

            db.ref('sezonlarDB').on('value', (snap) => {
                const list = snap.val() || ["2026"];
                const select = document.getElementById('sezonSelect');
                select.innerHTML = "";
                const arr = Array.isArray(list) ? list : Object.values(list);
                arr.forEach(s => select.innerHTML += `<option value="${s}">${s}</option>`);
                if (defs.sezon) select.value = defs.sezon;
            });
        });

        db.ref('bakimMasraflariDB').on('value', (snapshot) => {
            tumBakimlar = snapshot.val() || {};
            verileriCiz();
        });

        function verileriCiz() {
            const tbody = document.getElementById('bakimTableBody');
            tbody.innerHTML = "";

            if (Object.keys(tumBakimlar).length === 0) {
                tbody.innerHTML = "<tr><td colspan='5'>Kayıtlı bakım masrafı bulunamadı.</td></tr>";
                return;
            }

            const keys = Object.keys(tumBakimlar).reverse();
            for (let key of keys) {
                const item = tumBakimlar[key];
                tbody.innerHTML += `
                    <tr>
                        <td>${item.tarih}</td>
                        <td><b>${item.tur}</b></td>
                        <td><b>${item.tutar} TL</b></td>
                        <td>${item.aciklama || '-'}</td>
                        ${userPermission !== "oku" ? `<td><button class="btn-del" onclick="bakimSil('${key}')">Sil</button></td>` : ''}
                    </tr>`;
            }
        }

        function bakimKaydet() {
            if (userPermission === "oku") return;

            const tutar = parseFloat(document.getElementById('bakimTutar').value) || 0;
            const tur = document.getElementById('bakimTurSelect').value;
            if (tutar <= 0) return alert("Lütfen geçerli bir tutar girin!");

            db.ref('bakimMasraflariDB').push({
                tur: tur,
                odeyen: document.getElementById('kisiSelect').value,
                sezon: document.getElementById('sezonSelect').value,
                tutar: tutar,
                tarih: document.getElementById('bakimTarih').value,
                aciklama: document.getElementById('bakimAciklama').value,
                ekleyen: currentUser
            }, (error) => {
                if (!error) {
                    logEkle("Bakım Masrafı Eklendi", `${tutar.toFixed(2)} TL - ${tur}`);
                    document.getElementById('bakimTutar').value = "";
                    document.getElementById('bakimAciklama').value = "";
                    alert("Bakım masrafı başarıyla kaydedildi.");
                }
            });
        }

        function bakimSil(key) {
            if (userPermission === "oku") return;
            if (confirm("Bu bakım kaydını silmek istediğinize emin misiniz?")) {
                const silinen = tumBakimlar[key];
                db.ref('bakimMasraflariDB/' + key).remove(() => {
                    logEkle("Bakım Masrafı Silindi", silinen ? `${silinen.tutar || 0} TL - ${silinen.tur || ''}` : `ID: ${key}`);
                });
            }
        }
    </script>
</body>
</html>
