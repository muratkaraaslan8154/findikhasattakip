<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araç ve Yol Masrafları</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.replace('giris.html');
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; padding: 1.5rem 1rem; display: flex; flex-direction: column; align-items: center; margin:0; }
        .container { width: 100%; max-width: 700px; background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { border-bottom: 2px solid #805ad5; padding-bottom: 10px; color: #2d3748; margin-top: 0; display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem;}
        
        .readonly-banner { background: #feebc8; color: #7b341e; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; display: none; }

        .form-section { background: #faf5ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #805ad5; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #4a5568;}
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        
        .btn-add { background: #805ad5; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-back { background: #edf2f7; color: #4a5568; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px; text-decoration: none; display: inline-block;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
        th { background-color: #edf2f7; color: #4a5568; }
        .btn-del { background: #e53e3e; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .img-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid #cbd5e0; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="btn-back">⬅️ Ana Menüye Dön</a>
        
        <h2>🚗 Araç Masrafları <span style="font-size:0.85rem; color:#718096; font-weight:normal;" id="userDisplay"></span></h2>

        <div id="readOnlyBanner" class="readonly-banner">
            👁️ Salt Okunur Mod: Bu sayfadaki verileri görüntüleyebilirsiniz ancak yeni kayıt ekleyemez veya silemezsiniz.
        </div>

        <div id="formSection" class="form-section">
            <div class="form-group">
                <label>Araç / Plaka:</label>
                <select id="plakaSelect"></select>
            </div>

            <div class="form-group">
                <label>Masraf Türü:</label>
                <select id="turSelect">
                    <option value="Yakıt (Benzin/Motorin)">Yakıt (Benzin/Motorin)</option>
                    <option value="Periyodik Bakım & Tamir">Periyodik Bakım & Tamir</option>
                    <option value="Muayene & Sigorta & Kasko">Muayene & Sigorta & Kasko</option>
                    <option value="Lastik & Yedek Parça">Lastik & Yedek Parça</option>
                    <option value="Yıkama & Temizlik">Yıkama & Temizlik</option>
                    <option value="Diğer Araç Gideri">Diğer Araç Gideri</option>
                </select>
            </div>

            <div class="form-group">
                <label>Ödeyen Kişi:</label>
                <select id="kisiSelect"></select>
            </div>

            <div class="form-group">
                <label>Ait Olduğu Sezon:</label>
                <select id="sezonSelect"></select>
            </div>

            <div class="form-group">
                <label>Tutar (TL):</label>
                <input type="number" id="aracTutar" placeholder="0.00">
            </div>

            <div class="form-group">
                <label>Araç Kilometresi (İsteğe Bağlı):</label>
                <input type="number" id="aracKm" placeholder="Örn: 145000">
            </div>

            <div class="form-group">
                <label>Tarih:</label>
                <input type="date" id="aracTarih">
            </div>

            <div class="form-group">
                <label>Fiş / Fatura Görseli (İsteğe Bağlı):</label>
                <input type="file" id="aracFoto" accept="image/*">
            </div>

            <div class="form-group">
                <label>Açıklama / Detaylar:</label>
                <textarea id="aracAciklama" rows="2" placeholder="Örn: Yağ ve filtre değişimi yapıldı..."></textarea>
            </div>

            <button class="btn-add" onclick="aracMasrafKaydet()">Masraf Kaydını Ekle</button>
        </div>

        <h3>📋 Geçmiş Araç Kayıtları</h3>
        <table>
            <thead>
                <tr>
                    <th>Görsel</th>
                    <th>Tarih</th>
                    <th>Araç / Tür</th>
                    <th>Tutar</th>
                    <th>Açıklama</th>
                    <th id="actionTh">İşlem</th>
                </tr>
            </thead>
            <tbody id="aracTableBody">
                <tr><td colspan="6">Yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyApN7vhnM30cQ1RdAsXiUS8AY08G2QklYY",
            authDomain: "findikhasattakip.firebaseapp.com",
            databaseURL: "https://findikhasattakip-default-rtdb.firebaseio.com",
            projectId: "findikhasattakip",
            storageBucket: "findikhasattakip.firebasestorage.app",
            messagingSenderId: "296913243470",
            appId: "1:296913243470:web:f2a6cfed4196ff44e0221f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const currentUser = localStorage.getItem('currentUser') || 'Anonim';
        document.getElementById('userDisplay').innerText = `(${currentUser})`;

        // --- ONLINE DURUM & LOGLEMA ---
        if (currentUser !== 'Anonim') {
            const connectedRef = db.ref('.info/connected');
            const userPresenceRef = db.ref('onlineUsersDB/' + currentUser);

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    userPresenceRef.onDisconnect().set({
                        status: 'offline',
                        lastSeen: new Date().toLocaleString('tr-TR')
                    });

                    userPresenceRef.set({
                        status: 'online',
                        lastSeen: new Date().toLocaleString('tr-TR'),
                        device: /Android|iPhone|iPad/i.test(navigator.userAgent) ? '📱 Mobil' : '💻 Bilgisayar'
                    });
                }
            });
        }

        function logEkle(islemAdi, detay = '') {
            db.ref('logsDB').push({
                kullanici: currentUser,
                islem: islemAdi,
                detay: detay,
                tarih: new Date().toLocaleString('tr-TR'),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        logEkle("Sayfa Ziyareti", "Araç & Yol Masrafları Sayfası");

        document.getElementById('aracTarih').valueAsDate = new Date();

        let userPermission = "tam";
        let tumAracMasraflari = {};

        if (currentUser) {
            db.ref('usersDB/' + currentUser).on('value', (snapshot) => {
                const userData = snapshot.val();
                if (userData && userData.permissions) {
                    userPermission = userData.permissions.arac || "tam";
                    yetkiUygula();
                }
            });
        }

        function yetkiUygula() {
            if (userPermission === "oku") {
                document.getElementById('formSection').style.display = "none";
                document.getElementById('readOnlyBanner').style.display = "block";
                document.getElementById('actionTh').style.display = "none";
            } else {
                document.getElementById('formSection').style.display = "block";
                document.getElementById('readOnlyBanner').style.display = "none";
                document.getElementById('actionTh').style.display = "table-cell";
            }
        }

        db.ref('varsayilanlarDB').on('value', (snapshot) => {
            const defs = snapshot.val() || {};
            
            db.ref('araclarDB').on('value', (snap) => {
                const list = snap.val() || [];
                const select = document.getElementById('plakaSelect');
                select.innerHTML = "";
                const arr = Array.isArray(list) ? list : Object.values(list);
                arr.forEach(a => select.innerHTML += `<option value="${a}">${a}</option>`);
                if (defs.arac) select.value = defs.arac;
            });

            db.ref('kisilerDB').on('value', (snap) => {
                const list = snap.val() || [];
                const select = document.getElementById('kisiSelect');
                select.innerHTML = "";
                const arr = Array.isArray(list) ? list : Object.values(list);
                arr.forEach(k => select.innerHTML += `<option value="${k}">${k}</option>`);
                if (defs.kisi) select.value = defs.kisi;
            });

            db.ref('sezonlarDB').on('value', (snap) => {
                const list = snap.val() || ["2026"];
                const select = document.getElementById('sezonSelect');
                select.innerHTML = "";
                const arr = Array.isArray(list) ? list : Object.values(list);
                arr.forEach(s => select.innerHTML += `<option value="${s}">${s}</option>`);
                if (defs.sezon) select.value = defs.sezon;
            });
        });

        db.ref('aracMasraflariDB').on('value', (snapshot) => {
            tumAracMasraflari = snapshot.val() || {};
            verileriCiz();
        });

        function verileriCiz() {
            const tbody = document.getElementById('aracTableBody');
            tbody.innerHTML = "";

            if (Object.keys(tumAracMasraflari).length === 0) {
                tbody.innerHTML = "<tr><td colspan='6'>Kayıtlı araç masrafı bulunamadı.</td></tr>";
                return;
            }

            const keys = Object.keys(tumAracMasraflari).reverse();
            for (let key of keys) {
                const item = tumAracMasraflari[key];
                const imgHtml = item.foto ? `<img src="${item.foto}" class="img-thumb" onclick="window.open('${item.foto}')">` : '-';
                const canModify = (userPermission !== "oku") && (item.ekleyen === currentUser);
                
                tbody.innerHTML += `
                    <tr>
                        <td>${imgHtml}</td>
                        <td>${item.tarih}</td>
                        <td><b>${item.plaka}</b><br><span style="font-size:0.75rem; color:#718096;">${item.tur}</span></td>
                        <td><b>${item.tutar} TL</b>${item.km ? `<br><span style="font-size:0.75rem; color:#718096;">${item.km} KM</span>` : ''}</td>
                        <td>${item.aciklama || '-'}</td>
                        <td>${canModify ? `<button class="btn-del" onclick="aracMasrafSil('${key}')">Sil</button>` : '-'}</td>
                    </tr>`;
            }
        }

        async function aracMasrafKaydet() {
            if (userPermission === "oku") return;

            const tutar = parseFloat(document.getElementById('aracTutar').value) || 0;
            const plaka = document.getElementById('plakaSelect').value;
            const tur = document.getElementById('turSelect').value;

            if (tutar <= 0) return alert("Lütfen geçerli bir tutar girin!");

            const fileInput = document.getElementById('aracFoto');
            let fotoBase64 = "";

            if (fileInput.files.length > 0) {
                fotoBase64 = await base64Dönüştür(fileInput.files[0]);
            }

            db.ref('aracMasraflariDB').push({
                plaka: plaka,
                tur: tur,
                odeyen: document.getElementById('kisiSelect').value,
                sezon: document.getElementById('sezonSelect').value,
                tutar: tutar,
                km: document.getElementById('aracKm').value,
                tarih: document.getElementById('aracTarih').value,
                aciklama: document.getElementById('aracAciklama').value,
                foto: fotoBase64,
                ekleyen: currentUser
            }, (error) => {
                if (!error) {
                    logEkle("Araç Masrafı Eklendi", `${tutar.toFixed(2)} TL - ${plaka} (${tur})`);
                    document.getElementById('aracTutar').value = "";
                    document.getElementById('aracKm').value = "";
                    document.getElementById('aracAciklama').value = "";
                    fileInput.value = "";
                    alert("Kayıt başarıyla eklendi.");
                }
            });
        }

        function base64Dönüştür(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function aracMasrafSil(key) {
            if (userPermission === "oku") return alert("Yetkiniz yok!");
            
            const silinen = tumAracMasraflari[key];
            if (silinen && silinen.ekleyen && silinen.ekleyen !== currentUser) {
                return alert(`Bu kaydı yalnızca oluşturan kişi (${silinen.ekleyen}) silebilir!`);
            }

            if (confirm("Silmek istediğinize emin misiniz?")) {
                db.ref('aracMasraflariDB/' + key).remove(() => {
                    logEkle("Araç Masrafı Silindi", silinen ? `${silinen.tutar || 0} TL - ${silinen.plaka || ''} (${silinen.tur || ''})` : `ID: ${key}`);
                });
            }
        }
    </script>
</body>
</html>
