<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araç ve Yol Masrafları</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.replace('giris.html');
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; padding: 1.5rem 1rem; display: flex; flex-direction: column; align-items: center; margin:0; }
        .container { width: 100%; max-width: 700px; background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { border-bottom: 2px solid #805ad5; padding-bottom: 10px; color: #2d3748; margin-top: 0; display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem;}
        .form-section { background: #faf5ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #805ad5; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #4a5568;}
        input, select { width: 100%; padding: 9px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
        .btn { background: #805ad5; color: white; width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; font-size: 0.95rem; margin-top: 5px;}
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #cbd5e0; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e2e8f0; font-size: 0.82rem; }
        th { background-color: #edf2f7; color: #4a5568; }
        .btn-del { background: #e53e3e; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .btn-back { display: block; text-align: center; margin-top: 20px; color: #718096; text-decoration: none; font-weight: 500;}
        .read-only-notice { display: none; background: #feebc8; color: #744210; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; text-align: center; margin-bottom: 15px; }
        .alert-box { display:none; background: #fff5f5; border: 1px solid #feb2b2; border-left: 5px solid #e53e3e; border-radius: 6px; padding: 10px; margin-bottom: 15px; font-size: 0.85rem; color: #9b2c2c; }
        .img-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; border: 1px solid #cbd5e0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚗 Araç Masrafları & Belge Takibi <span id="userTag" style="font-size:0.8rem; font-weight:normal; color:#718096;"></span></h2>
        
        <div id="readOnlyNotice" class="read-only-notice">👁️ Bu sayfada sadece görüntüleme yetkiniz bulunmaktadır. Kayıt veya silme yapamazsınız.</div>
        <div id="aracUyariBox" class="alert-box"></div>

        <div class="form-section" id="aracFormArea">
            <h3 style="margin-top:0; font-size:1rem; color:#553c9a;">Yeni Araç / Yol / Belge Kaydı</h3>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1;">
                    <label>Araç / Plaka:</label>
                    <select id="plakaSelect"></select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Masraf Türü:</label>
                    <select id="turSelect">
                        <option value="⛽ Yakıt">⛽ Yakıt</option>
                        <option value="🛠️ Bakım / Tamir">🛠️ Bakım / Tamir</option>
                        <option value="📋 Muayene / Sigorta">📋 Muayene / Sigorta</option>
                        <option value="💳 MTV Ödemesi">💳 MTV Ödemesi</option>
                        <option value="🚨 Trafik Cezası">🚨 Trafik Cezası</option>
                        <option value="🌉 Köprü / Otoyol (HGS)">🌉 Köprü / Otoyol (HGS)</option>
                        <option value="📦 Diğer">📦 Diğer</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1;">
                    <label>Ödeyen Kişi:</label>
                    <select id="kisiSelect"></select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Sezon:</label>
                    <select id="sezonSelect"></select>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1;">
                    <label>Tutar (TL):</label>
                    <input type="number" step="0.01" id="aracTutar" placeholder="0.00">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Km (Opsiyonel):</label>
                    <input type="number" id="aracKm" placeholder="Örn: 145000">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1;">
                    <label>Tarih:</label>
                    <input type="date" id="aracTarih">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Belge / Makbuz Fotoğrafı:</label>
                    <input type="file" id="aracFotoInput" accept="image/*">
                </div>
            </div>
            <div class="form-group">
                <label>Açıklama / Güzergah:</label>
                <input type="text" id="aracAciklama" placeholder="Açıklama">
            </div>
            <button class="btn" id="btnKaydet" onclick="aracMasrafKaydet()" disabled>Yükleniyor...</button>
        </div>

        <h3 style="font-size: 1rem; color: #2d3748; margin: 15px 0 5px 0;">Araç Masraf & Belge Geçmişi</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>Tarih</th><th>Plaka</th><th>Tür</th><th>Ödeyen</th><th>Tutar</th><th>Fotoğraf</th><th>Açıklama</th><th id="actionHead">İşlem</th></tr>
                </thead>
                <tbody id="aracTableBody"></tbody>
            </table>
        </div>

        <a href="index.html" class="btn-back">← Ana Menüye Dön</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyApN7vhnM30cQ1RdAsXiUS8AY08G2QklYY",
            authDomain: "findikhasattakip.firebaseapp.com",
            databaseURL: "https://findikhasattakip-default-rtdb.firebaseio.com",
            projectId: "findikhasattakip",
            storageBucket: "findikhasattakip.firebasestorage.app",
            messagingSenderId: "296913243470",
            appId: "1:296913243470:web:f2a6cfed4196ff44e0221f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const currentUser = localStorage.getItem('currentUser') || "";
        document.getElementById('userTag').innerText = "(" + currentUser + ")";
        document.getElementById('aracTarih').valueAsDate = new Date();

        let userPermission = "oku"; // Varsayılan kilitli
        let uyariAyarlar = {
            muayene: { gun: 30, saat: 0, dakika: 0 },
            sigorta: { gun: 30, saat: 0, dakika: 0 },
            mtv: { gun: 15, saat: 0, dakika: 0 }
        };

        // YETKİ KONTROLÜ
        db.ref('usersDB/' + currentUser + '/permissions/arac').on('value', (s) => {
            userPermission = s.val() || "oku";
            const btn = document.getElementById('btnKaydet');
            
            if (userPermission === "yok") {
                alert("Erişim yetkiniz yok!");
                window.location.replace('index.html');
            } else if (userPermission === "oku") {
                document.getElementById('aracFormArea').style.display = 'none';
                document.getElementById('readOnlyNotice').style.display = 'block';
                if(btn) btn.disabled = true;
                document.getElementById('actionHead').style.display = 'none';
            } else {
                document.getElementById('aracFormArea').style.display = 'block';
                document.getElementById('readOnlyNotice').style.display = 'none';
                if(btn) {
                    btn.disabled = false;
                    btn.innerText = "Masrafı / Kaydı Ekle";
                }
                document.getElementById('actionHead').style.display = '';
            }
            renderAracMasraflari();
        });

        db.ref('varsayilanlarDB/uyariAyar').on('value', (s) => {
            if(s.val()) uyariAyarlar = s.val();
            aracTarihKontrol();
        });

        setInterval(aracTarihKontrol, 1000);

        // DİNAMİK LİSTELER
        let rawAraclar = [];
        db.ref('araclarDB').on('value', (s) => {
            rawAraclar = s.val() || [];
            db.ref('varsayilanlarDB/arac').once('value', (defSnap) => {
                const defPlaka = defSnap.val();
                const select = document.getElementById('plakaSelect');
                select.innerHTML = rawAraclar.map(item => {
                    const plaka = typeof item === 'object' ? item.plaka : item;
                    const isDef = plaka === defPlaka ? 'selected' : '';
                    return `<option value="${plaka}" ${isDef}>${plaka}</option>`;
                }).join('');
            });
            aracTarihKontrol();
        });

        db.ref('kisilerDB').on('value', (s) => {
            document.getElementById('kisiSelect').innerHTML = (s.val() || []).map(i => `<option value="${i}">${i}</option>`).join('');
        });

        db.ref('sezonlarDB').on('value', (s) => {
            document.getElementById('sezonSelect').innerHTML = (s.val() || []).map(i => `<option value="${i}">${i}</option>`).join('');
        });

        function aracTarihKontrol() {
            const box = document.getElementById('aracUyariBox');
            let uyarılar = [];
            const simdi = new Date().getTime();

            rawAraclar.forEach(a => {
                if(typeof a === 'object') {
                    const hedefler = [
                        { key: 'muayeneTarihi', etiket: '📋 Muayene', ayar: uyariAyarlar.muayene },
                        { key: 'sigortaTarihi', etiket: '🛡️ Sigorta', ayar: uyariAyarlar.sigorta },
                        { key: 'mtvTarihi', etiket: '💳 MTV', ayar: uyariAyarlar.mtv }
                    ];

                    hedefler.forEach(item => {
                        if(a[item.key]) {
                            const hedefZaman = new Date(a[item.key] + "T23:59:59").getTime();
                            const farkMs = hedefZaman - simdi;
                            const esikMs = (((item.ayar.gun || 0) * 24 * 60) + ((item.ayar.saat || 0) * 60) + (item.ayar.dakika || 0)) * 60 * 1000;

                            if(farkMs <= esikMs) {
                                const isExpired = farkMs < 0;
                                const mutlakMs = Math.abs(farkMs);

                                const d = Math.floor(mutlakMs / (1000 * 60 * 60 * 24));
                                const h = Math.floor((mutlakMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                                const m = Math.floor((mutlakMs % (1000 * 60 * 60)) / (1000 * 60));
                                const s = Math.floor((mutlakMs % (1000 * 60)) / 1000);

                                const zamanStr = `${d}g ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

                                uyarılar.push(`⚠️ <b>${a.plaka}</b> - ${item.etiket}: ${a[item.key]} (${isExpired ? '<span style="color:red">SÜRE GEÇTİ!</span>' : 'Kalan: ' + zamanStr})`);
                            }
                        }
                    });
                }
            });

            if(uyarılar.length > 0) {
                box.style.display = 'block';
                box.innerHTML = "<b>🔔 Canlı Araç Uyarı Süreleri:</b><br>" + uyarılar.join('<br>');
            } else {
                box.style.display = 'none';
            }
        }

        // MASRAF LİSTELEME
        let aracData = {};
        db.ref('aracMasraflariDB').on('value', (s) => {
            aracData = s.val() || {};
            renderAracMasraflari();
        });

        function renderAracMasraflari() {
            const tbody = document.getElementById('aracTableBody');
            tbody.innerHTML = "";

            for (const [key, item] of Object.entries(aracData)) {
                const fotoTag = item.foto ? `<a href="${item.foto}" target="_blank"><img src="${item.foto}" class="img-thumb"></a>` : '-';
                tbody.innerHTML += `
                    <tr>
                        <td>${item.tarih}</td>
                        <td><b>${item.plaka}</b></td>
                        <td>${item.tur}</td>
                        <td>${item.odeyen}</td>
                        <td><b>${parseFloat(item.tutar).toFixed(2)} ₺</b></td>
                        <td>${fotoTag}</td>
                        <td>${item.aciklama || '-'}</td>
                        ${userPermission !== "oku" ? `<td><button class="btn-del" onclick="aracMasrafSil('${key}')">Sil</button></td>` : ''}
                    </tr>`;
            }
        }

        async function aracMasrafKaydet() {
            if (userPermission === "oku") {
                alert("Salt okunur yetkisine sahipsiniz, yeni kayıt ekleyemezsiniz!");
                return;
            }

            const tutar = document.getElementById('aracTutar').value;
            if (!tutar || tutar <= 0) return alert("Lütfen geçerli bir tutar girin!");

            const fileInput = document.getElementById('aracFotoInput');
            let fotoBase64 = "";
            if (fileInput.files.length > 0) {
                fotoBase64 = await base64Dönüştür(fileInput.files[0]);
            }

            db.ref('aracMasraflariDB').push({
                plaka: document.getElementById('plakaSelect').value,
                tur: document.getElementById('turSelect').value,
                odeyen: document.getElementById('kisiSelect').value,
                sezon: document.getElementById('sezonSelect').value,
                tutar: parseFloat(tutar),
                km: document.getElementById('aracKm').value,
                tarih: document.getElementById('aracTarih').value,
                aciklama: document.getElementById('aracAciklama').value,
                foto: fotoBase64,
                ekleyen: currentUser
            });

            document.getElementById('aracTutar').value = "";
            document.getElementById('aracKm').value = "";
            document.getElementById('aracAciklama').value = "";
            fileInput.value = "";
            alert("Kayıt başarıyla eklendi.");
        }

        function base64Dönüştür(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function aracMasrafSil(key) {
            if (userPermission === "oku") return alert("Yetkiniz yok!");
            if (confirm("Silmek istediğinize emin misiniz?")) {
                db.ref('aracMasraflariDB/' + key).remove();
            }
        }
    </script>
</body>
</html>
